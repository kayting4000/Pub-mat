services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pubmat
      POSTGRES_PASSWORD: pubmat
      POSTGRES_DB: pubmat_db
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: supersecretkey
      POSTGRES_URL: postgresql+asyncpg://pubmat:pubmat@postgres/pubmat_db
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: pubmat_drafts_db
    depends_on:
      - postgres
      - mongo
